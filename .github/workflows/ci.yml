name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile on ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: .\mvnw.cmd -B test

      - name: Test on Unix
        if: ${{ runner.os != 'Windows' }}
        run: ./mvnw -B test